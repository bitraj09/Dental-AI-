name: Dental AI Security Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  # ==========================================
  # 1. SECRET SCANNING
  # ==========================================
  gitleaks:
    name: 🔐 Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================
  # 2. SEMGREP SAST
  # ==========================================
  semgrep:
    name: 🔎 Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/javascript
            p/typescript
            p/security-audit
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}


  # ==========================================
  # 3. CODEQL
  # ==========================================
  codeql:
    name: 🧠 CodeQL Analysis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@v3


  # ==========================================
  # 4. NODE.JS DEPENDENCY SECURITY
  # ==========================================
  npm-audit:
    name: 📦 NPM Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high


  # ==========================================
  # 5. PYTHON DEPENDENCY SECURITY
  # ==========================================
  pip-audit:
    name: 🐍 Python Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit ML service dependencies
        run: pip-audit -r ml-service/requirements.txt


  # ==========================================
  # 6. TRIVY FILESYSTEM SCAN
  # ==========================================
  trivy-fs:
    name: 🛡️ Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table


  # ==========================================
  # 7. DOCKER BUILD + TRIVY IMAGE SCAN
  # ==========================================
  docker-security:
    name: 🐳 Docker Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t dental-ai:security-test .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dental-ai:security-test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table


  # ==========================================
  # 8. SBOM GENERATION
  # ==========================================
  sbom:
    name: 📋 Generate SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: dental-ai-sbom
          path: sbom.json