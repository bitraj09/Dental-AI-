services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: dental_root
      MYSQL_DATABASE: dental
      MYSQL_USER: dental
      MYSQL_PASSWORD: dental123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udental", "-pdental123"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      ML_SERVICE_URL: http://ml-service:8001
      DATABASE_URL: mysql://dental:dental123@mysql:3306/dental
    command: sh -lc "./node_modules/.bin/prisma migrate deploy && node server.js"
    ports:
      - "3000:3000"

volumes:
  mysql_data: